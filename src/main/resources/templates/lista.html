<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="card shadow">
            <div class="card-header bg-info text-white d-flex justify-content-between">
                <h2 class="text-center">Lista de Productos</h2>
                <div>
                    <span th:text="'Usuario: ' + ${username}"></span>
                    <a th:href="@{/auth/logout}" class="btn btn-sm btn-danger ms-2">Cerrar sesión</a>
                </div>
            </div>
            <div class="card-body">
                <a th:href="@{/productos/crear}" class="btn btn-success mb-3">Crear Nuevo Producto</a>
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Categoría</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="producto : ${productos}">
                            <td th:text="${producto.id}"></td>
                            <td th:text="${producto.nombre}"></td>
                            <td th:text="${producto.descripcion}"></td>
                            <td th:text="${'$' + #numbers.formatDecimal(producto.precio, 1, 2)}"></td>
                            <td th:text="${producto.categoria}"></td>
                            <td>
                                <a th:href="@{/productos/editar/{id}(id=${producto.id})}" class="btn btn-warning btn-sm">Editar</a>
                                <form th:action="@{/productos/eliminar/{id}(id=${producto.id})}" method="post" style="display: inline;">
                                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
