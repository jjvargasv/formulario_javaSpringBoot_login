<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Crear Producto</title>
</head>
<body>
    <h1>Crear Producto</h1>
    <form th:action="@{/productos}" th:object="${producto}" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" th:field="*{nombre}" required>
        <br>
        <label for="descripcion">Descripción:</label>
        <input type="text" id="descripcion" name="descripcion" th:field="*{descripcion}">
        <br>
        <label for="precio">Precio:</label>
        <input type="number" id="precio" name="precio" th:field="*{precio}" required>
        <br>
        <label for="categoria">Categoría:</label>
        <input type="text" id="categoria" name="categoria" th:field="*{categoria}">
        <br>
        <button type="submit">Guardar</button>
    </form>
    <a href="/productos">Volver a la lista</a>
</body>
</html>
